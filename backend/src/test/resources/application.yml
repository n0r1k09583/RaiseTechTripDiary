# テストは本番の SQLite ファイルを触らない。メモリ上の H2 を使う。
# H2 2.x に MODE=SQLite は無い。Flyway はテスト用 DDL（db/h2）を使う。
# テスト中はアクセスログファイルを書かない。
server:
  tomcat:
    accesslog:
      enabled: false
spring:
  datasource:
    url: jdbc:h2:mem:timeline-test;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 5
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/h2
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.raisetech.tripdiary.domain
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: test-secret-do-not-use-in-prod
  access-expiration-ms: 900000
  refresh-expiration-ms: 604800000

cors:
  origins: http://127.0.0.1:5173

app:
  upload-dir: ./target/uploads-test
