<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ユーザー検索 — 課題提出</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="search">
  <main class="page" id="shell">
    <section class="card">
      <h1>ユーザー検索</h1>
      <p class="lead">ユーザー名の部分一致です。結果からプロフィールへ進み、フォローできます。</p>
      <form action="search.html" method="get">
        <label for="q">ユーザー名</label>
        <input id="q" name="q" type="text" placeholder="hana" />
        <div class="row-actions"><button class="btn" type="submit">検索</button></div>
      </form>
    </section>
    <section class="card">
      <h1 id="result-label">検索結果</h1>
      <div id="results"></div>
    </section>
  </main>
  <div class="modal-bg" id="modal-bg"><div class="modal"></div></div>
  <script src="js/app.js"></script>
</body>
</html>
